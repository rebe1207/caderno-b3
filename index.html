<style>
/* Layout: a study notebook. Sticky header with language switch + tab strip; one reading column (~900px). */
:root{
  --bg:#f5f6f0; --surface:#ffffff; --surface-2:#eef1e9; --ink:#1b2520; --muted:#56635b; --line:#d8ded3;
  --accent:#1d6646; --accent-ink:#ffffff; --accent-soft:#dcebe2;
  --sun:#b87a0b; --sun-soft:#f6ead2;
  --ok:#1f7a3c; --ok-bg:#e1f2e5; --bad:#ae3328; --bad-bg:#f8e3e0; --warn:#8a6100; --warn-bg:#f7edd2;
  --f-display:"Alegreya", Georgia, "Times New Roman", serif;
  --f-body:"Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111814; --surface:#18211c; --surface-2:#1f2a24; --ink:#e4ebe5; --muted:#9aa89f; --line:#2c3a32;
  --accent:#62c394; --accent-ink:#0b1510; --accent-soft:#1f3b2d;
  --sun:#e3b14d; --sun-soft:#3a2f17;
  --ok:#73d395; --ok-bg:#183323; --bad:#f19184; --bad-bg:#3b1d1a; --warn:#e9c35f; --warn-bg:#352b12;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111814; --surface:#18211c; --surface-2:#1f2a24; --ink:#e4ebe5; --muted:#9aa89f; --line:#2c3a32;
  --accent:#62c394; --accent-ink:#0b1510; --accent-soft:#1f3b2d;
  --sun:#e3b14d; --sun-soft:#3a2f17;
  --ok:#73d395; --ok-bg:#183323; --bad:#f19184; --bad-bg:#3b1d1a; --warn:#e9c35f; --warn-bg:#352b12;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.15;margin:0}
h1{font-size:clamp(2rem,6vw,3rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:1.75rem;font-weight:700}
h3{font-size:1.2rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.pt{font-style:italic}
header.top{padding-block:28px 16px;display:grid;gap:10px}
header.top p{max-width:64ch;color:var(--muted)}
.langs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.langs button{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 .82rem var(--f-mono);padding:5px 10px;border-radius:6px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.strip{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:8px}
.strip::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;border:1px solid transparent;background:none;color:var(--muted);font:600 .95rem var(--f-body);padding:7px 13px;border-radius:999px;cursor:pointer}
nav.tabs button:hover{color:var(--ink);background:var(--surface-2)}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible,select:focus-visible,.card:focus-visible,a:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
section.panel{display:grid;gap:20px;padding-top:24px}
.lead{max-width:68ch;display:grid;gap:6px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.flag{background:var(--sun-soft);border-left:3px solid var(--sun);padding:10px 14px;border-radius:0 8px 8px 0;font-size:.93rem}
.flag b{color:var(--sun)}
.tr{background:var(--surface-2);border-radius:8px;padding:10px 14px;font-size:.93rem;color:var(--ink)}
.tr .eyebrow{display:block;margin-bottom:3px}
.src{font-size:.8rem;color:var(--muted);display:grid;gap:3px}
.src b{font-weight:600;color:var(--ink)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.v{font-family:var(--f-mono);font-size:.86rem;white-space:nowrap}
.mini td,.mini th{padding:4px 8px}
ul.clean,ol.clean{margin:0;padding-left:1.15em;display:grid;gap:5px}
.kicker{font-family:var(--f-display);font-size:1.05rem;font-weight:700}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:600 .92rem var(--f-body);padding:8px 14px;border-radius:8px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 .88rem var(--f-body);padding:6px 11px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chip small{color:var(--muted)}
.tag{font-size:.74rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.new{background:var(--sun-soft);color:var(--sun)}
.tag.course{background:var(--accent-soft);color:var(--ink)}
.bhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.bhead .row{gap:6px}
.item{border-top:1px solid var(--line);padding-block:14px;display:grid;gap:8px}
.item .q{line-height:1.95}
.num{font-family:var(--f-mono);color:var(--muted);font-size:.85rem;margin-right:6px}
input.gap{font:500 1rem var(--f-body);color:var(--ink);background:var(--surface-2);border:none;border-bottom:2px solid var(--line);border-radius:4px 4px 0 0;padding:2px 6px;width:9.5em;max-width:100%}
input.gap.wide{width:12em}
input.gap.ok{border-color:var(--ok);background:var(--ok-bg)}
input.gap.bad{border-color:var(--bad);background:var(--bad-bg)}
input.gap.almost{border-color:var(--warn);background:var(--warn-bg)}
.hint{color:var(--muted);font-size:.9rem}
.fb{font-size:.93rem;border-radius:8px;padding:8px 12px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb.almost{background:var(--warn-bg);color:var(--warn)}
.fb .why{color:var(--ink);display:block;margin-top:4px}
.opts{display:grid;gap:6px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 .95rem var(--f-body);padding:9px 12px;border-radius:8px;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.score{font-family:var(--f-mono);font-size:.88rem;color:var(--muted)}
.score b{color:var(--ink)}
.drill{display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.prompt{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline}
.prompt .verb{font-family:var(--f-display);font-size:2rem;font-weight:800}
.tag.t{background:var(--accent-soft);color:var(--ink);font-size:.82rem}
.drill input{font:500 1.25rem var(--f-body);padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);width:100%;max-width:360px}
.keys{display:flex;flex-wrap:wrap;gap:4px}
.keys button{font:500 1rem var(--f-body);min-width:36px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);cursor:pointer}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-height:210px;display:grid;place-items:center;text-align:center;padding:26px 18px;cursor:pointer;gap:8px;user-select:none}
.card .w{font-family:var(--f-display);font-size:clamp(1.6rem,6vw,2.3rem);font-weight:700}
.card .trs{display:grid;gap:4px;font-size:1.08rem}
.card .trs span b{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);margin-right:6px}
.card .exs{color:var(--muted);font-style:italic;max-width:50ch}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.reading p{max-width:68ch;margin-bottom:12px;line-height:1.75}
.g{border:none;background:none;color:inherit;font:inherit;padding:0;border-bottom:2px dotted var(--sun);cursor:pointer}
.g .gl{display:none}
.g.open .gl{display:inline;font-style:normal;font-size:.82em;background:var(--sun-soft);color:var(--ink);padding:1px 6px;border-radius:5px;margin-left:4px}
details{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px 16px}
details summary{cursor:pointer;font-weight:600}
details[open] summary{margin-bottom:10px}
select,input.search{font:500 .95rem var(--f-body);padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);max-width:100%}
input.search{width:100%;max-width:360px}
.ex{font-style:italic}
footer{margin-top:40px;font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);padding-top:16px;display:grid;gap:8px}
#p-home table{min-width:560px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>

</div>

function norm(s){return String(s).toLowerCase().replace(/[.!?,;:]/g,"").replace(/\s+/g," ").trim()}
function bare(s){return norm(s).normalize("NFD").replace(/[̀-ͯ]/g,"")}
function judge(input,alts){var n=norm(input);if(!n)return "empty";for(var i=0;i<alts.length;i++)if(norm(alts[i])===n)return "ok";for(var j=0;j<alts.length;j++)if(bare(alts[j])===bare(n))return "almost";return "bad"}

start2:{pt:"Faça 20 verbos em Exercícios → Conjugação.",en:"Do 20 verbs in Exercises → Conjugação.",fr:"Faites 20 verbes dans Exercices → Conjugação.",es:"Haz 20 verbos en Ejercicios → Conjugação.",ru:"Сделайте 20 глаголов в Упражнения → Conjugação."},

 after:function(){function r(q){q=bare(q||"");var h="<table class='mini'><thead><tr><th>verbo</th>"+PERS.map(function(p){return"<th>"+p+"</th>"}).join("")+"</tr></thead><tbody>";IRR.forEach(function(v){if(q&&bare(v.inf).indexOf(q)<0&&!v.f.some(function(x){return bare(x).indexOf(q)>=0}))return;var w=findWord(v.inf);h+="<tr><td><b>"+v.inf+"</b>"+(w?"<br><span class='muted' style='font-size:.8rem'>"+esc(gloss(w))+"</span>":"")+"</td>"+v.f.map(function(x){return"<td class='v'>"+x+"</td>"}).join("")+"</tr>"});$("#irrTable").innerHTML=h+"</tbody></table>"}r("");$("#irrq").addEventListener("input",function(e){r(e.target.value)})},

{id:"imp",title:"Pretérito imperfeito",
 intro:{pt:"Descreve o passado sem marcar começo e fim: hábitos, estados, descrições e o cenário de uma história. Também indica ações simultâneas, a hora no passado e um plano que não se realizou.",en:"Describes the past without marking a beginning or end: habits, states, descriptions and the background of a story. It also expresses simultaneous actions, clock time in the past, and a plan that did not happen.",fr:"Décrit le passé sans en marquer le début ni la fin : habitudes, états, descriptions et décor d'un récit. Il exprime aussi des actions simultanées, l'heure dans le passé et un projet non réalisé.",es:"Describe el pasado sin marcar inicio ni fin: hábitos, estados, descripciones y el escenario de una historia. También expresa acciones simultáneas, la hora en el pasado y un plan que no se realizó.",ru:"Описывает прошлое без начала и конца: привычки, состояния, описания, фон истории. Также — одновременные действия, время суток в прошлом и несостоявшийся план."},
 body:function(){return"<div class='tbl'><table class='mini'><thead><tr><th>Uso</th><th>Exemplo</th><th></th></tr></thead><tbody>"+
  [["Hábito no passado","Todos os dias, ele tomava café antes de sair.","curso"],["Estado contínuo","Minha família morava em uma casa pequena.","curso"],["Descrição","Ela era baixa e magra.","MIT"],["Ações simultâneas","Enquanto Maria lia, Paulo preparava o jantar.","MIT"],["Hora no passado","Eram duas horas da tarde quando Pedro chegou.","MIT"],["Plano não realizado","Ele ia vir mas ficou doente.","MIT"]].map(function(r){return"<tr><td>"+r[0]+"</td><td class='pt'>"+r[1]+"</td><td class='muted' style='font-size:.8rem'>"+r[2]+"</td></tr>"}).join("")+"</tbody></table></div>"+
  "<p class='kicker'>Regulares</p>"+conjTable(["","falar (-ar)","comer (-er)","partir (-ir)"],[["eu","falava","comia","partia"],["tu","falavas","comias","partias"],["ele / você","falava","comia","partia"],["nós","falávamos","comíamos","partíamos"],["vós","faláveis","comíeis","partíeis"],["eles / vocês","falavam","comiam","partiam"]])+
  "<p class='kicker'>Só quatro irregulares</p>"+conjTable(["","ser","ter","vir","pôr"],PERS.map(function(p,i){return[p].concat(IMP.map(function(v){return v.f[i]}))}))+
  "<p class='hint'>O verbo <i>ir</i> aparece à parte no material do MIT: <span class='pt'>eu ia, tu ias, ele ia, nós íamos, eles iam</span>. Nos slides do curso, as formas de <i>vós</i> aparecem sem acento («tinheis», «vinheis»); a grafia padrão é <i>tínheis, vínheis</i>, como <i>comíeis</i>.</p>"},

{id:"asp",title:"Perfeito × Imperfeito",
 intro:{pt:"O imperfeito monta o cenário; o perfeito traz o fato que interrompe ou se destaca. Pergunte: a ação terminou num momento preciso (perfeito) ou é hábito, estado ou descrição (imperfeito)?",en:"The imperfeito sets the scene; the perfeito brings in the event that interrupts it or stands out. Ask: did the action end at a specific moment (perfeito), or is it a habit, state or description (imperfeito)?",fr:"L'imperfeito plante le décor ; le perfeito introduit l'événement qui l'interrompt ou se détache. Demandez-vous : l'action s'est-elle achevée à un moment précis (perfeito) ou est-ce une habitude, un état, une description (imperfeito) ?",es:"El imperfeito monta el escenario; el perfeito trae el hecho que lo interrumpe o destaca. Pregúntate: ¿la acción terminó en un momento preciso (perfeito) o es un hábito, estado o descripción (imperfeito)?",ru:"Imperfeito задаёт фон, perfeito вводит событие, которое его прерывает или выделяется. Спросите себя: действие закончилось в конкретный момент (perfeito) или это привычка, состояние, описание (imperfeito)?"},
 body:function(){return"<div class='grid2'><div><p class='kicker'>Perfeito</p><p class='pt'>ontem, na semana passada, no mês passado, em 2022, na terça-feira passada, um dia, certa manhã, de repente</p></div><div><p class='kicker'>Imperfeito</p><p class='pt'>antigamente, naquela época, quando eu era criança, todos os dias, sempre, frequentemente, mensalmente, enquanto</p></div></div>"+
  "<p class='hint'>Marcadores retirados dos exercícios do curso.</p><p class='ex'>Eu <b>caminhava</b> pela cidade quando de repente <b>encontrei</b> um velho amigo.</p><p class='ex'>Enquanto ela <b>estudava</b> para a prova, o irmão <b>entrou</b> no quarto.</p>"+
  "<p><b>O sentido decide, não só o marcador.</b> No texto do curso: <span class='pt'>«Durante muitos anos, o Brasil foi uma colônia de Portugal»</span>. Um período longo, mas visto como fechado, vai para o perfeito.</p>"},
 course:["Aula Pretéritos.pdf","Atividade B3.PDF"],ext:["ppedia","mit"]},
{id:"dim",title:"Diminutivos",
 intro:{pt:"O diminutivo indica tamanho pequeno, mas no Brasil serve muito para mostrar carinho, deixar um pedido mais gentil ou dar ênfase.",en:"The diminutive shows small size, but in Brazil it is often used for affection, to make a request more polite, or for emphasis.",fr:"Le diminutif indique la petite taille, mais au Brésil il sert souvent à exprimer l'affection, à rendre une demande plus polie ou à insister.",es:"El diminutivo indica tamaño pequeño, pero en Brasil se usa mucho para mostrar cariño, hacer un pedido más amable o dar énfasis.",ru:"Диминутив обозначает малый размер, но в Бразилии он часто выражает нежность, делает просьбу вежливее или усиливает смысл."},
 body:function(){return"<div class='tbl'><table class='mini'><thead><tr><th>Regra</th><th>Exemplos</th></tr></thead><tbody>"+
  [["-inho / -inha: tira-se a vogal final átona","gato → gatinho · bola → bolinha · lobo → lobinho"],["-zinho / -zinha: última sílaba tônica","café → cafezinho · pé → pezinho"],["-zinho: ditongo ou duas vogais no fim","pai → paizinho · boa → boazinha"],["-zinho: som nasal","trem → trenzinho · bom → bonzinho"],["-zinho: terminação -dade","cidade → cidadezinha"],["Se a palavra tem S no radical, mantém o S + -inho","casa → casinha · país → paisinho"],["g e c duros: acrescenta-se u","amigo → amiguinho · manga → manguinha"],["m vira n antes de -zinho","trem → trenzinho · bom → bonzinho"],["A palavra perde o acento gráfico","café → cafezinho · pé → pezinho"],["Plural: plural da palavra sem o -s final + -zinhos/-zinhas","flores → florezinhas · mãos → mãozinhas · balões → balõezinhos"]].map(function(r){return"<tr><td>"+r[0]+"</td><td class='pt'>"+r[1]+"</td></tr>"}).join("")+"</tbody></table></div>"+
  "<div class='grid2'><div><p class='kicker'>Carinho</p><p class='ex'>Aceita um cafezinho? · Ele é um amigão!</p></div><div><p class='kicker'>Gentileza</p><p class='ex'>Pode esperar um minutinho? · Tenho só uma duvidazinha.</p></div><div><p class='kicker'>Ênfase</p><p class='ex'>Precisamos acordar cedinho amanhã. (cedo → cedinho)</p></div></div>"+
  "<div class='flag'><b>Grafia nos slides.</b> Nos slides aparecem «cafézinho», «Pézinho» e «tremzinho». A grafia padrão é <i>cafezinho, pezinho, trenzinho</i> (fontes abaixo). Nos exercícios, a resposta esperada é a grafia padrão («tremzinho» também é aceito).</div>"},
 course:["Aula 1.pptx (slides 3–12)"],ext:["mango","dicio_pai","dicio_pl","cafe","priberam","ie_dim"]},
{id:"aum",title:"Aumentativos",
 intro:{pt:"O aumentativo indica tamanho grande, mas também intensidade, admiração ou, às vezes, tom pejorativo. Regra básica: -ão (masculino) e -ona (feminino), com muitas formas irregulares.",en:"The augmentative shows large size, but also intensity, admiration or sometimes a pejorative tone. Basic rule: -ão (masculine) and -ona (feminine), with many irregular forms.",fr:"L'augmentatif indique la grande taille, mais aussi l'intensité, l'admiration ou parfois un ton péjoratif. Règle de base : -ão (masculin) et -ona (féminin), avec de nombreuses formes irrégulières.",es:"El aumentativo indica tamaño grande, pero también intensidad, admiración o, a veces, un tono despectivo. Regla básica: -ão (masculino) y -ona (femenino), con muchas formas irregulares.",ru:"Аугментатив обозначает большой размер, а также интенсивность, восхищение или иногда пренебрежение. Базовое правило: -ão (м. р.) и -ona (ж. р.), много неправильных форм."},

  [["-ão (curso)","livro → livrão · carro → carrão · amigo → amigão · calor → calorão · médico → médicozão"],["-ona (curso)","mão → mãozona"],["Irregulares (curso)","casa → casarão · chapéu → chapelão · garrafa → garrafão · homem → homenzão"],["Outros sufixos (InfoEscola)","-aço: inchaço · -aça: barcaça · -arra: bocarra · -orra: cabeçorra"],["Analítico: adjetivo","uma casa grande · um cachorro enorme"]].map(function(r){return"<tr><td>"+r[0]+"</td><td class='pt'>"+r[1]+"</td></tr>"}).join("")+"</tbody></table></div>"+
  "<div class='grid2'><div><p class='kicker'>Exagero e intensidade</p><p class='ex'>Que calorão hoje! · Ele é um médicozão!</p></div><div><p class='kicker'>Pejorativo</p><p class='ex'>narigão, bocarra</p></div></div>"+
  "<p><b>Cuidado:</b> nem toda palavra em -ão é aumentativo: <span class='pt'>pão, mão, avião</span>.</p>"},
 course:["Aula 1.pptx (slides 9–12)"],ext:["ie_aum"]},
{id:"saude",title:"Saúde no Brasil",
 intro:{pt:"No Brasil, o SUS (Sistema Único de Saúde) garante acesso universal, integral e gratuito aos serviços de saúde. Saber aonde ir economiza tempo: a UBS é a porta de entrada para casos menos graves; a UPA 24h atende urgências; o SAMU (192) atende emergências com risco imediato à vida.",en:"In Brazil, the SUS (Sistema Único de Saúde) guarantees universal, comprehensive and free access to health services. Knowing where to go saves time: the UBS is the entry point for less serious cases; the UPA 24h handles urgent cases; SAMU (192) handles emergencies with an immediate risk to life.",fr:"Au Brésil, le SUS (Sistema Único de Saúde) garantit un accès universel, intégral et gratuit aux services de santé. Savoir où aller fait gagner du temps : l'UBS est la porte d'entrée pour les cas moins graves ; l'UPA 24h prend en charge les urgences ; le SAMU (192) intervient en cas de danger de mort immédiat.",es:"En Brasil, el SUS (Sistema Único de Saúde) garantiza acceso universal, integral y gratuito a los servicios de salud. Saber adónde ir ahorra tiempo: la UBS es la puerta de entrada para casos menos graves; la UPA 24h atiende urgencias; el SAMU (192) atiende emergencias con riesgo inmediato para la vida.",ru:"В Бразилии SUS (Sistema Único de Saúde) гарантирует всеобщий, полный и бесплатный доступ к медицинской помощи. Важно знать, куда идти: UBS — первая точка обращения в нетяжёлых случаях; UPA 24h — неотложная помощь; SAMU (192) — экстренные случаи с прямой угрозой жизни."},
 body:function(){return"<div class='tbl'><table class='mini'><thead><tr><th>Serviço</th><th>O que é / quando procurar</th></tr></thead><tbody>"+
  [["UBS — Unidade Básica de Saúde","Porta de entrada do SUS, para casos menos graves: consultas de clínica geral, pediatria e ginecologia, vacinação, exames de sangue, urina e fezes, medicamentos do SUS. Na cidade de São Paulo: de segunda a sexta, das 7h às 19h."],["UPA 24h — Unidade de Pronto Atendimento","Funciona 24 horas, 7 dias por semana. Urgências como febre acima de 39 °C, dor aguda, cortes profundos, fraturas, falta de ar intensa, convulsões. O médico pode manter o paciente em observação ou encaminhá-lo ao hospital."],["Hospital","Internações, cirurgias, exames complexos, terapia intensiva."],["SAMU — telefone 192","Situações graves e emergenciais, com risco imediato à vida."],["Cartão Nacional de Saúde (cartão do SUS)","Documento de identificação do usuário do SUS; liga a pessoa ao seu histórico de atendimentos."],["Farmácia Popular","Programa do Ministério da Saúde com farmácias privadas credenciadas (selo «Aqui tem Farmácia Popular»). Alguns remédios são gratuitos (por exemplo, para diabetes, asma e hipertensão). É preciso levar documento com foto e CPF e uma receita médica válida."]].map(function(r){return"<tr><td><b>"+r[0]+"</b></td><td>"+r[1]+"</td></tr>"}).join("")+"</tbody></table></div>"+
  "<p class='kicker'>Expressões da aula</p><div class='tbl'><table class='mini'><thead><tr><th>Expressão</th><th>Significado</th><th>Exemplo</th></tr></thead><tbody>"+
  [["dar entrada (no hospital, na UPA, na UBS)","iniciar o registro de atendimento","Ele deu entrada na UPA com suspeita de dengue."],["passar mal","ter uma indisposição física ou mal-estar repentino","Eu passava mal toda vez que tomava aquele antibiótico."],["medicação de uso contínuo","medicamento tomado diariamente","O médico pediu para que eu suspendesse minha medicação de uso contínuo."],["fazer a triagem","etapa de avaliação inicial de risco em postos de saúde","Enquanto eu fazia a triagem, o enfermeiro mediu minha pressão."],["estar de jejum","ficar sem se alimentar por várias horas, geralmente antes de exames","Eu estava de jejum desde as 22h para fazer o exame de sangue."]].map(function(r){return"<tr><td><b>"+r[0]+"</b></td><td>"+r[1]+"</td><td class='pt'>"+r[2]+"</td></tr>"}).join("")+"</tbody></table></div>"+
  "<p><b>Gramática na prática:</b> na ficha de triagem da aula, o <b>histórico</b> (o que você fazia e sentia nos últimos dias) vai no <b>imperfeito</b>, e o <b>evento</b> (o que aconteceu quando decidiu ir ao posto) vai no <b>perfeito</b>. Veja o tema «Perfeito × Imperfeito».</p>"+
  "<div class='flag'><b>Grafia no slide.</b> O slide escreve «desde às 22h». Depois de <i>desde</i> não há crase: o padrão é <i>desde as 22h</i>. Usamos a forma padrão.</div>"},
 course:["Aula Saúde (1).pdf"],ext:["sus","ubs_sp","upa_sp","conass","samu","cns","cns2","farm","crase_tm","crase_dicio"]},
{id:"semana",title:"Dias da semana: plural e minúscula",
 intro:{pt:"De segunda a sexta, o nome do dia é um substantivo composto: numeral + «feira». No plural, os dois elementos variam: sextas-feiras, não «sexta-feiras». Sábado e domingo são palavras simples e só recebem -s. Os dias da semana se escrevem com letra minúscula.",en:"From Monday to Friday, the day's name is a compound noun: a numeral + «feira». In the plural both parts change: sextas-feiras, not «sexta-feiras». Sábado and domingo are simple words and just add -s. Days of the week are written in lowercase.",fr:"Du lundi au vendredi, le nom du jour est un nom composé : numéral + « feira ». Au pluriel, les deux éléments varient : sextas-feiras, et non « sexta-feiras ». Sábado et domingo sont des mots simples et prennent seulement un -s. Les jours de la semaine s'écrivent en minuscule.",es:"De lunes a viernes, el nombre del día es un sustantivo compuesto: numeral + «feira». En plural varían los dos elementos: sextas-feiras, no «sexta-feiras». Sábado y domingo son palabras simples y solo reciben -s. Los días de la semana se escriben con minúscula.",ru:"С понедельника по пятницу название дня — сложное существительное: числительное + «feira». Во множественном числе изменяются обе части: sextas-feiras, а не «sexta-feiras». Sábado и domingo — простые слова, к ним просто добавляется -s. Дни недели пишутся со строчной буквы."},
 body:function(){return"<div class='tbl'><table class='mini'><thead><tr><th>Singular</th><th>Plural</th></tr></thead><tbody>"+
  [["segunda-feira","segundas-feiras"],["terça-feira","terças-feiras"],["quarta-feira","quartas-feiras"],["quinta-feira","quintas-feiras"],["sexta-feira","sextas-feiras"],["sábado","sábados"],["domingo","domingos"]].map(function(r){return"<tr><td class='pt'>"+r[0]+"</td><td class='pt'><b>"+r[1]+"</b></td></tr>"}).join("")+"</tbody></table></div>"+
  "<p><b>Por quê?</b> <i>Segunda, terça…</i> (numeral) e <i>feira</i> (substantivo) são palavras variáveis; num composto assim, as duas vão para o plural.</p>"+
  "<p class='ex'>uma sexta-feira → duas sextas-feiras · a próxima sexta-feira → as próximas sextas-feiras · toda sexta-feira → todas as sextas-feiras</p>"+
  "<p><b>Minúscula.</b> O Acordo Ortográfico (Base XIX) manda escrever com minúscula os nomes dos dias, dos meses e das estações do ano.</p>"+
  "<p class='ex'>A reunião será na próxima sexta-feira. (e não: «Sexta-Feira») · Estas aulas são dadas aos sábados.</p>"},
 course:["Qual o plural de sexta-feira (UOL Educação, página salva)"],ext:["uol_sexta","dicio_seg","ie_b19","tm_maius"]},
{id:"hifen",title:"Mão de obra: locuções sem hífen",
 intro:{pt:"Desde o Acordo Ortográfico, as locuções (grupos de palavras ligados por preposição, como «de») em geral não têm hífen. Por isso o certo hoje é «mão de obra»; a forma «mão-de-obra» aparece em textos anteriores ao Acordo. Plural: mãos de obra.",en:"Since the Spelling Agreement, locutions (word groups joined by a preposition such as «de») generally have no hyphen. So the correct form today is «mão de obra»; «mão-de-obra» appears in texts from before the Agreement. Plural: mãos de obra.",fr:"Depuis l'Accord orthographique, les locutions (groupes de mots reliés par une préposition comme « de ») ne prennent en général pas de trait d'union. On écrit donc aujourd'hui « mão de obra » ; « mão-de-obra » apparaît dans des textes antérieurs à l'Accord. Pluriel : mãos de obra.",es:"Desde el Acuerdo Ortográfico, las locuciones (grupos de palabras unidos por una preposición como «de») en general no llevan guion. Por eso hoy lo correcto es «mão de obra»; «mão-de-obra» aparece en textos anteriores al Acuerdo. Plural: mãos de obra.",ru:"После Орфографического соглашения устойчивые сочетания (слова, связанные предлогом, например «de»), как правило, пишутся без дефиса. Поэтому сейчас правильно «mão de obra», а «mão-de-obra» встречается в текстах до реформы. Множественное число: mãos de obra."},
 body:function(){return"<div class='grid2'><div><p class='kicker'>Hoje</p><p class='pt'><b>mão de obra</b> · plural: <b>mãos de obra</b></p></div><div><p class='kicker'>Antes do Acordo</p><p class='pt'><s>mão-de-obra</s></p></div></div>"+
  "<p><b>Significados</b> (Dicio, UOL): 1) o conjunto de trabalhadores necessários para uma obra ou atividade; 2) o trabalho desses profissionais e o seu custo.</p>"+
  "<p class='ex'>A empresa precisa contratar mão de obra especializada. · O custo da mão de obra aumentou. · O setor enfrenta falta de mão de obra qualificada.</p>"+
  "<p><b>A regra geral</b> (Acordo Ortográfico, Base XV, item 6): não se usa hífen em locuções. Exemplos da própria Base: <span class='pt'>sala de jantar, fim de semana, cor de vinho, à vontade, depois de amanhã</span>.</p>"+
  "<p><b>Exceções</b> listadas na Base XV: <span class='pt'>água-de-colônia, arco-da-velha, cor-de-rosa, mais-que-perfeito, pé-de-meia, ao deus-dará, à queima-roupa</span>.</p>"+
  "<p><b>Dica de estilo</b> (UOL): no plural, muitas vezes é mais natural dizer <span class='pt'>profissionais, trabalhadores</span> ou <span class='pt'>força de trabalho</span>.</p>"},
 course:["Mão de obra ou mão-de-obra (UOL Educação, página salva)"],ext:["uol_mao","dicio_mao","dicio_mao2","ie_b15"]}

asp:[
 {id:"asp1",title:"Exercício 1: Nuances de Sentido",src:"Aula Pretéritos.pdf",course:true,type:"fill",items:[
  {s:"Na semana passada, eu ___ uma crise alérgica terrível durante o trabalho.",v:["ter"],a:[["tive"]],why:"«Na semana passada»: fato único e concluído → perfeito."},
  {s:"Nós ___ muito angustiados na sala de espera quando o médico finalmente ___ as notícias.",v:["estar","trazer"],a:[["estávamos"],["trouxe"]],why:"Estado de fundo (imperfeito) interrompido por um fato (perfeito)."},
  {s:"Quando eu era criança, eu ___ muito no parque, mas no ano passado ___ lá com meus amigos.",v:["brincar","voltar"],a:[["brincava"],["voltei"]],why:"Hábito na infância → imperfeito; «no ano passado», uma vez → perfeito."},
  {s:"Antigamente, nós ___ em uma casa pequena, mas em 2022 ___ para um apartamento.",v:["morar","mudar"],a:[["morávamos"],["mudamos","nos mudamos"]],why:"«Antigamente»: estado contínuo; «em 2022»: momento preciso."},
  {s:"Enquanto ela ___ para a prova, o irmão ___ no quarto e começou a conversar.",v:["estudar","entrar"],a:[["estudava"],["entrou"]],why:"«Enquanto»: ação em andamento; a entrada do irmão é o fato."},
  {s:"Eu ___ pela cidade quando de repente ___ um velho amigo.",v:["caminhar","encontrar"],a:[["caminhava"],["encontrei"]],why:"«De repente» marca o fato que acontece no cenário."},
  {s:"Quando chegamos ao restaurante, as pessoas já ___, mas nós ainda não ___ nada.",v:["comer","pedir"],a:[["comiam"],["pedimos","tínhamos pedido"]],why:"As pessoas estavam comendo quando chegamos: cenário → imperfeito.",flag:"No segundo espaço, dentro do conteúdo do curso, cabe «pedimos». Fora do curso, o mais natural seria «tínhamos pedido» (mais-que-perfeito composto). Confirme com o professor."},
  {s:"Ele sempre ___ de ônibus, mas no mês passado ___ um carro.",v:["viajar","comprar"],a:[["viajava"],["comprou"]],why:"«Sempre» no passado: hábito; «no mês passado»: fato."},
  {s:"Naquela época, eu não ___ de café, mas um dia ___ um cappuccino e gostei.",v:["gostar","experimentar"],a:[["gostava"],["experimentei"]],why:"«Naquela época»: estado; «um dia»: fato único."},
  {s:"Nós ___ na sala quando o professor ___ e pediu silêncio.",v:["conversar","chegar"],a:[["conversávamos"],["chegou"]],why:"A conversa era o cenário; a chegada do professor é o fato."}]},
 {id:"asp2",title:"Exercício 2: Múltipla Escolha",src:"Aula Pretéritos.pdf",course:true,type:"mc",items:[
  {q:"Naquela época, a Sra. Maria ___ consultas mensalmente porque ___ tonturas. Porém, na terça-feira passada, ela ___ uma queda e ___ direto para a emergência.",o:["marcava / sentia / teve / foi","marcou / sentiu / tinha / ia","marcava / teve / sentia / foi","marcou / sentia / teve / ia"],c:0,why:"«Naquela época, mensalmente»: hábito e sintoma prolongado (imperfeito). «Na terça-feira passada»: dois fatos (perfeito)."},
  {q:"Quando viajávamos pela Europa, nós ___ sempre de trem porque ___ que era a maneira mais prática de conhecer as cidades. No entanto, em Paris, ___ um problema com a nossa reserva e ___ obrigados a procurar outro hotel.",o:["viajávamos / achávamos / tivemos / fomos","viajamos / achávamos / tínhamos / éramos","viajávamos / achamos / tivemos / íamos","viajamos / achávamos / tivemos / éramos"],c:0,why:"«Sempre» e opinião → imperfeito; o caso em Paris → perfeito."},
  {q:"Na época em que Carlos ___ naquela empresa, ele ___ frequentemente até tarde. Na última semana, porém, o chefe ___ uma reunião inesperada e ___ a equipe inteira para participar.",o:["trabalhou / ficava / marcava / convocava","trabalhava / ficava / marcou / convocou","trabalhava / ficou / marcou / convocava","trabalhou / ficou / marcava / convocou"],c:1,why:"«Na época em que, frequentemente» → imperfeito; «na última semana» → perfeito."},
  {q:"Quando meus avós ___ no interior, eles ___ uma pequena loja que funcionava todos os dias. Certa manhã, enquanto meu avô ___ o estabelecimento, um cliente ___ e pediu ajuda.",o:["moraram / tiveram / abriu / entrava","moravam / tinham / abriu / entrou","moravam / tiveram / abria / entrou","moraram / tinham / abriu / entrava"],c:1,why:"Discutível: o cenário (moravam, tinham) só está correto em b). Mas depois de «enquanto» o esperado seria «abria», que só aparece em c), junto com o erro «tiveram». Nenhuma opção é perfeita; b) é a melhor. Confirme com o professor."}]},

  {s:"Nós ___ para o interior durante as férias.",v:["viajar"],a:[["viajamos"]]},
  {s:"Eles ___ cedo à festa.",v:["chegar"],a:[["chegaram"]]},

  {s:"Quando eu ___ criança, ___ muito na rua.",v:["ser","brincar"],a:[["era"],["brincava"]]},
  {s:"Minha família ___ em uma casa pequena.",v:["morar"],a:[["morava"]]},
  {s:"Todos os dias, ele ___ café antes de sair.",v:["tomar"],a:[["tomava"]]},
  {s:"Quando ___ juntos, nós ___ muito.",v:["estudar","conversar"],a:[["estudávamos"],["conversávamos"]]},
  {s:"Antigamente, eu ___ televisão todas as noites.",v:["assistir"],a:[["assistia"]]}]},
 {id:"asp4",title:"Do texto sobre a Independência",src:"Atividade B3.PDF (respostas = formas do texto original)",course:true,type:"fill",items:[
  {s:"Durante muitos anos, o Brasil ___ uma colônia de Portugal.",v:["ser"],a:[["foi"]],why:"No texto: perfeito. O período é visto como fechado."},
  {s:"Em 1808, a família real portuguesa ___ para o Rio de Janeiro.",v:["mudar-se"],a:[["mudou-se","se mudou"]]},
  {s:"Em 1821, Dom João VI ___ para Portugal, mas seu filho, Dom Pedro, ___ no Brasil.",v:["voltar","permanecer"],a:[["voltou"],["permaneceu"]]},
  {s:"Portugal ___ recuperar parte do controle que havia perdido.",v:["querer"],a:[["queria"]],why:"Desejo como estado → imperfeito."},
  {s:"Esses grupos ___ que o Brasil tivesse mais autonomia.",v:["defender"],a:[["defendiam"]]},
  {s:"Dom Pedro ___ a separação entre Brasil e Portugal em setembro de 1822.",v:["declarar"],a:[["declarou"]]},
  {s:"A separação também ___ conflitos em diferentes regiões, porque nem todos ___ o novo governo.",v:["provocar","apoiar"],a:[["provocou"],["apoiavam"]]},
  {s:"A escravidão ___ existindo.",v:["continuar"],a:[["continuou"]]}]},
 {id:"aspN",title:"Perfeito ou imperfeito?",src:"",course:false,type:"fill",items:[
  {s:"Quando eu morava no Rio, eu ___ à praia todos os fins de semana.",v:["ir"],a:[["ia"]],why:"Hábito no passado («todos os fins de semana»)."},
  {s:"Ontem, nós ___ um bolo para a festa.",v:["fazer"],a:[["fizemos"]],why:"«Ontem»: fato concluído."},
  {s:"Eram oito horas quando o ônibus ___.",v:["chegar"],a:[["chegou"]],why:"Hora no passado (imperfeito «eram») + fato (perfeito)."},
  {s:"Enquanto eu ___, minha irmã ___ a louça.",v:["cozinhar","lavar"],a:[["cozinhava"],["lavava"]],why:"Duas ações simultâneas → imperfeito nas duas."},
  {s:"Na semana passada, ela ___ o celular na bolsa e saiu.",v:["pôr"],a:[["pôs"]],why:"Fato único. Atenção ao acento: pôs."},
  {s:"Quando criança, ele ___ um cachorro chamado Rex.",v:["ter"],a:[["tinha"]],why:"Estado durante a infância."},
  {s:"Em 2019, eles ___ ao Brasil pela primeira vez.",v:["vir"],a:[["vieram"]],why:"Momento preciso (2019)."},
  {s:"Antigamente, as pessoas ___ cartas; hoje mandam mensagens.",v:["escrever"],a:[["escreviam"]],why:"«Antigamente»: hábito."},
  {s:"Eu ___ em casa quando você ligou.",v:["estar"],a:[["estava"]],why:"Cenário interrompido por «você ligou»."},
  {s:"Ontem à noite, vocês ___ o jogo?",v:["ver"],a:[["viram"]],why:"«Ontem à noite»: fato concluído."},
  {s:"O dia ___ bonito e o sol ___.",v:["estar","brilhar"],a:[["estava"],["brilhava"]],why:"Descrição do cenário."},
  {s:"Ela não ___ vir à aula ontem porque estava doente.",v:["poder"],a:[["pôde"]],why:"Passado de poder com acento: pôde."},
  {s:"Meus pais ___ presentes da viagem no mês passado.",v:["trazer"],a:[["trouxeram"]],why:"«No mês passado»: fato."},
  {s:"Ele ___ vir à festa, mas ficou doente.",v:["ir"],a:[["ia"]],why:"Plano que não se realizou: ia + infinitivo."}]}
],

 {id:"time2",title:"Sol Novum, Parte I: Múltipla Escolha",src:"Atividade_Projeto_SolNovum_B3.pdf",course:true,type:"mc",items:[
  {q:"Todos os dias, eu ___ às 7h, mas ontem eu ___ até mais tarde.",o:["acordo / dormi","acordei / durmo","acordo / durmo","acordei / dormi"],c:0,why:"«Todos os dias» → presente; «ontem» → perfeito."},
  {q:"No próximo fim de semana, nós ___ para Maceió com nossos amigos.",o:["fomos viajar","vamos viajar","vamos viajamos","fomos viajamos"],c:1,why:"Futuro: ir no presente + infinitivo."},
  {q:"Ontem à noite, as gatas não ___ a ração porque ___ dormindo profundamente.",o:["comem / estão","comeram / estavam","comeram / estiveram","vão comer / estão"],c:1,why:"Fato (não comeram) + cenário em andamento (estavam dormindo)."},

 {id:"time4",title:"Sol Novum, Parte III: Correlacionar",src:"Atividade_Projeto_SolNovum_B3.pdf",course:true,type:"match",items:[

saude:[
 {id:"sau1",title:"Questões de Verdadeiro ou Falso",src:"Aula Saúde (1).pdf",course:true,type:"mc",items:[
  ["Elena faltou ao trabalho logo nos primeiros dias em que sentiu tonturas.",1,"Falso: «como era uma trabalhadora dedicada, queria ir trabalhar a qualquer custo»."],
  ["O atendimento na triagem foi rápido porque Elena trouxe seus documentos e o cartão do SUS.",0,"Verdadeiro: «o que agilizou tudo quando deu entrada na triagem»."],
  ["Elena foi encaminhada com urgência ao médico porque teve um pico de febre na sala de espera.",0,"Verdadeiro."],
  ["O médico diagnosticou Elena com enxaqueca crônica e lhe deu cinco dias de atestado.",1,"Falso: «disse que era uma virose severa e lhe deu dois dias de atestado»."],
  ["Elena não conseguiu pegar os remédios na UBS e teve que ir a uma farmácia paga.",1,"Falso: «esteve na farmácia do posto, recebeu os remédios»."],
  ["No final do dia, o remédio já fazia efeito e Elena soube que estava fora de perigo.",0,"Verdadeiro."]].map(function(x){return{q:x[0],o:["Verdadeiro","Falso"],c:x[1],why:x[2]}})},
 {id:"sau2",title:"O dia de Elena: perfeito ou imperfeito?",src:"Aula Saúde (1).pdf (respostas = formas do texto original)",course:true,type:"fill",items:[
  {s:"Há dias Elena ___ que algo estava errado: ___ tonturas frequentes e estava exausta.",v:["sentir","ter"],a:[["sentia"],["tinha"]],why:"Sintomas prolongados no passado → imperfeito."},
  {s:"Como ___ uma trabalhadora dedicada, ___ ir trabalhar a qualquer custo.",v:["ser","querer"],a:[["era"],["queria"]],why:"Característica e desejo → imperfeito."},
  {s:"Ontem de manhã ela ___ com uma enxaqueca insuportável e não ___ nem sair da cama.",v:["acordar","poder"],a:[["acordou"],["pôde"]],why:"«Ontem de manhã»: fatos → perfeito. Pôde com acento."},
  {s:"Sem alternativa, Elena ___ forças e ___ direto para a UBS do bairro.",v:["reunir","ir"],a:[["reuniu"],["foi"]]},

function blockHead(b){return"<div class='bhead'><h3>"+esc(b.title)+"</h3><div class='row'>"+(b.course?"<span class='tag course'>"+t("course")+"</span>":"<span class='tag new'>"+t("newt")+"</span>")+"<span class='score' id='sc-"+b.id+"'></span></div></div>"+(b.src?"<p class='src'>"+esc(b.src)+" · "+t("key_ours")+"</p>":"")}
function fillBlock(box,b){
  box.innerHTML=blockHead(b);var res={};
  b.items.forEach(function(it,n){
    var d=el("div",{class:"item"});var parts=it.s.split("___");var h="<div class='q'><span class='num'>"+(n+1)+"</span>";
    parts.forEach(function(p,i){h+=esc(p);if(i<parts.length-1)h+="<input class='gap"+(b.wide?" wide":"")+"' autocomplete='off' autocapitalize='off' spellcheck='false' aria-label='"+(i+1)+"'>"+(it.v&&it.v[i]?" <span class='hint'>("+esc(it.v[i])+")</span>":"")});
    h+="</div><div class='row'><button class='btn ghost' type='button'>"+t("check")+"</button>"+(it.flag?"<span class='tag'>"+t("disputed")+"</span>":"")+"</div><div class='out'></div>";
    d.innerHTML=h;box.appendChild(d);
    var ins=[].slice.call(d.querySelectorAll("input"));
    function run(){var all=true,al=false;ins.forEach(function(inp,i){var r=judge(inp.value,it.a[i]);inp.classList.remove("ok","bad","almost");inp.classList.add(r==="empty"?"bad":r);if(r!=="ok")all=false;if(r==="almost")al=true});
      var cls=all?"ok":al?"almost":"bad";var ans=it.a.map(function(a){return a[0]}).join(" · ");
      d.querySelector(".out").innerHTML="<div class='fb "+cls+"'>"+(all?t("correct"):(al?t("almost")+" ":"")+t("answer")+" <b>"+esc(ans)+"</b>")+(it.why?"<span class='why'>"+esc(it.why)+"</span>":"")+(it.flag?"<span class='why'>"+esc(it.flag)+"</span>":"")+"</div>";
      res[n]=all;var r=0;for(var k in res)if(res[k])r++;$("#sc-"+b.id).innerHTML="<b>"+r+"</b> / "+b.items.length;saveScore(b.id,r,b.items.length)}
    d.querySelector("button").onclick=run;
    ins.forEach(function(inp,i){inp.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();if(i<ins.length-1)ins[i+1].focus();else run()}})});
  });
}
function mcBlock(box,b){
  box.innerHTML=blockHead(b);var res={};
  b.items.forEach(function(it,n){
    var d=el("div",{class:"item"});d.innerHTML="<div class='q'><span class='num'>"+(n+1)+"</span>"+esc(it.q)+"</div>";
    var o=el("div",{class:"opts"});var out=el("div");
    it.o.forEach(function(txt,i){var bt=el("button",{class:"opt",type:"button"},"<b>"+"abcd"[i]+")</b> "+esc(txt));bt.onclick=function(){if(n in res)return;res[n]=(i===it.c);[].forEach.call(o.children,function(x,j){if(j===it.c)x.classList.add("ok");else if(j===i)x.classList.add("bad")});
      out.innerHTML="<div class='fb "+(i===it.c?"ok":"bad")+"'>"+(i===it.c?t("correct"):t("rightopt")+" "+"abcd"[it.c]+")")+(it.why?"<span class='why'>"+esc(it.why)+"</span>":"")+"</div>";
      var r=0;for(var k in res)if(res[k])r++;$("#sc-"+b.id).innerHTML="<b>"+r+"</b> / "+b.items.length;saveScore(b.id,r,b.items.length)};o.appendChild(bt)});
    d.appendChild(o);d.appendChild(out);box.appendChild(d)});
  var rd=el("button",{class:"btn ghost",type:"button",text:t("redo")});rd.onclick=function(){mcBlock(box,b)};box.appendChild(rd);
}
function matchBlock(box,b){
  box.innerHTML=blockHead(b);
  b.items.forEach(function(st,si){
    var d=el("div",{class:"item"});var h="<div class='q'><span class='num'>"+(si+1)+"</span>"+t("match")+"</div><ol class='clean' style='list-style:decimal'>"+st.left.map(function(l){return"<li class='pt'>"+esc(l)+"</li>"}).join("")+"</ol>";
    st.right.forEach(function(r,ri){h+="<div class='row'><select data-ri='"+ri+"' aria-label='nº'><option value=''>?</option><option>1</option><option>2</option><option>3</option></select><span class='pt'>"+esc(r)+"</span></div>"});
    h+="<div class='row'><button class='btn ghost' type='button'>"+t("check")+"</button></div><div class='out'></div>";d.innerHTML=h;
    d.querySelector("button").onclick=function(){var ok=true;[].forEach.call(d.querySelectorAll("select"),function(s){if(+s.value!==st.key[+s.dataset.ri])ok=false});
      d.querySelector(".out").innerHTML="<div class='fb "+(ok?"ok":"bad")+"'>"+(ok?t("correct"):t("match_ans")+st.key.join(" · "))+"</div>"};
    box.appendChild(d)});
}

analysis:{pt:["O bloco gramatical principal até agora são os pretéritos: 35 verbos irregulares no perfeito, 4 no imperfeito e a escolha entre os dois pelo sentido.","A segunda linha é escolher o tempo pelo marcador: presente, perfeito ou futuro com ir.","A Aula 1 traz a formação de diminutivos e aumentativos e o seu uso cultural no Brasil.","Há um texto de leitura (história da Independência) com tarefa de vocabulário.","No slide 2 da Aula 1 os professores perguntam pelas necessidades reais: trabalho, saúde/médico, transporte, burocracia, conversa do dia a dia. A saúde já tem uma aula (Aula Saúde: SUS, UBS, UPA e triagem); trabalho, transporte e burocracia ainda não têm materiais.","Nenhum arquivo traz gabarito; por isso as chaves deste caderno são marcadas como nossas."],
 en:["The main grammar block so far is the past tenses: 35 irregular verbs in the perfeito, 4 in the imperfeito, and choosing between the two by meaning.","The second strand is choosing the tense from a time marker: present, perfeito or future with ir.","Aula 1 covers forming diminutives and augmentatives and their cultural use in Brazil.","There is one reading text (the history of Independence) with a vocabulary task.","On slide 2 of Aula 1 the teachers ask about real needs: work, health/doctor, transport, bureaucracy, everyday conversation. Health now has a lesson (Aula Saúde: SUS, UBS, UPA and triage); work, transport and bureaucracy have no materials yet.","No file includes an answer key, so the keys here are marked as ours."],
 fr:["Le principal bloc de grammaire jusqu'ici, ce sont les passés : 35 verbes irréguliers au perfeito, 4 à l'imperfeito, et le choix entre les deux selon le sens.","Deuxième axe : choisir le temps d'après le marqueur — présent, perfeito ou futur avec ir.","L'Aula 1 traite de la formation des diminutifs et augmentatifs et de leur usage culturel au Brésil.","Il y a un texte de lecture (histoire de l'Indépendance) avec une tâche de vocabulaire.","Sur la diapo 2 de l'Aula 1, les professeurs interrogent sur les besoins réels : travail, santé/médecin, transports, démarches administratives, conversation courante. La santé a maintenant une leçon (Aula Saúde : SUS, UBS, UPA et triage) ; travail, transports et démarches n'ont pas encore de supports.","Aucun fichier n'a de corrigé ; les corrigés de ce cahier sont donc indiqués comme les nôtres."],
 es:["El bloque gramatical principal hasta ahora son los pretéritos: 35 verbos irregulares en el perfeito, 4 en el imperfeito y la elección entre ambos según el sentido.","La segunda línea es elegir el tiempo según el marcador: presente, perfeito o futuro con ir.","La Aula 1 trata la formación de diminutivos y aumentativos y su uso cultural en Brasil.","Hay un texto de lectura (historia de la Independencia) con una tarea de vocabulario.","En la diapositiva 2 de la Aula 1 los profesores preguntan por necesidades reales: trabajo, salud/médico, transporte, burocracia, conversación diaria. La salud ya tiene una clase (Aula Saúde: SUS, UBS, UPA y triaje); trabajo, transporte y burocracia todavía no tienen materiales.","Ningún archivo trae clave de respuestas; por eso las claves de este cuaderno están marcadas como nuestras."],
 ru:["Главный грамматический блок пока — прошедшие времена: 35 неправильных глаголов в perfeito, 4 в imperfeito и выбор между ними по смыслу.","Вторая линия — выбор времени по маркеру: настоящее, perfeito или будущее с ir.","Aula 1 — образование диминутивов и аугментативов и их культурное употребление в Бразилии.","Есть один текст для чтения (история независимости) с заданием на лексику.","На слайде 2 Aula 1 преподаватели спрашивают о реальных нуждах: работа, здоровье/врач, транспорт, бюрократия, повседневный разговор. По здоровью уже есть урок (Aula Saúde: SUS, UBS, UPA и триаж); по работе, транспорту и бюрократии материалов пока нет.","Ни в одном файле нет ключей, поэтому ключи здесь помечены как наши."]},
steps:{pt:["Todos os dias, 10 minutos de conjugação: um conjunto por vez.","Uma vez por semana, um relato oral de 1–2 minutos em dupla: «O que eu fiz no fim de semana» (perfeito), «Quando eu era criança…» (imperfeito), «No próximo fim de semana eu vou…» (futuro). O colega anota as trocas de tempo.","Textos curtos de 5–7 frases com cenário no imperfeito e fato no perfeito, no modelo «Eu caminhava pela cidade quando de repente encontrei…». Corrijam uns aos outros usando a Teoria.","Vocabulário próprio sobre os temas do slide 2: saúde, transporte em São Paulo, documentos, trabalho. Os exercícios já trazem palavras de saúde (consulta, sala de espera, tonturas, emergência).","Novos materiais do semestre entram neste caderno com a mesma estrutura: teoria, exercícios com chave, dicionário.","Conferir as chaves marcadas como «discutível» em aula, uma vez."],
 en:["Every day, 10 minutes of conjugation: one set at a time.","Once a week, a 1–2 minute spoken story in pairs: «O que eu fiz no fim de semana» (perfeito), «Quando eu era criança…» (imperfeito), «No próximo fim de semana eu vou…» (future). Your partner notes tense mix-ups.","Short texts of 5–7 sentences with the background in the imperfeito and the event in the perfeito, on the model «Eu caminhava pela cidade quando de repente encontrei…». Correct each other using the Theory.","Your own vocabulary on the slide 2 topics: health, transport in São Paulo, documents, work. The exercises already contain health words (consulta, sala de espera, tonturas, emergência).","New semester materials go into this notebook with the same structure: theory, exercises with keys, dictionary.","Check the keys marked «debatable» in class, once."],
 fr:["Chaque jour, 10 minutes de conjugaison : une série à la fois.","Une fois par semaine, un récit oral de 1–2 minutes en binôme : « O que eu fiz no fim de semana » (perfeito), « Quando eu era criança… » (imperfeito), « No próximo fim de semana eu vou… » (futur). Le partenaire note les erreurs de temps.","Textes courts de 5–7 phrases avec le décor à l'imperfeito et l'événement au perfeito, sur le modèle « Eu caminhava pela cidade quando de repente encontrei… ». Corrigez-vous mutuellement avec la Théorie.","Votre propre vocabulaire sur les thèmes de la diapo 2 : santé, transports à São Paulo, documents, travail. Les exercices contiennent déjà du vocabulaire de santé (consulta, sala de espera, tonturas, emergência).","Les nouveaux supports du semestre entreront dans ce cahier avec la même structure : théorie, exercices corrigés, dictionnaire.","Vérifier une fois en cours les corrigés marqués « discutable »."],
 es:["Todos los días, 10 minutos de conjugación: un conjunto cada vez.","Una vez por semana, un relato oral de 1–2 minutos en parejas: «O que eu fiz no fim de semana» (perfeito), «Quando eu era criança…» (imperfeito), «No próximo fim de semana eu vou…» (futuro). El compañero anota las confusiones de tiempo.","Textos cortos de 5–7 frases con el escenario en imperfeito y el hecho en perfeito, según el modelo «Eu caminhava pela cidade quando de repente encontrei…». Corregíos entre vosotros con la Teoría.","Vocabulario propio sobre los temas de la diapositiva 2: salud, transporte en São Paulo, documentos, trabajo. Los ejercicios ya traen palabras de salud (consulta, sala de espera, tonturas, emergência).","Los nuevos materiales del semestre entrarán en este cuaderno con la misma estructura: teoría, ejercicios con clave, diccionario.","Revisar en clase, una vez, las claves marcadas como «discutible»."],
 ru:["Каждый день 10 минут спряжения, по одному набору.","Раз в неделю устный рассказ на 1–2 минуты в парах: «O que eu fiz no fim de semana» (perfeito), «Quando eu era criança…» (imperfeito), «No próximo fim de semana eu vou…» (будущее). Партнёр отмечает, где перепутаны времена.","Короткие тексты из 5–7 предложений: фон в imperfeito, событие в perfeito, по модели «Eu caminhava pela cidade quando de repente encontrei…». Проверяйте друг друга по Теории.","Свой словарь по темам слайда 2: здоровье, транспорт в São Paulo, документы, работа. В упражнениях уже есть слова про здоровье (consulta, sala de espera, tonturas, emergência).","Новые материалы семестра добавляются в этот сайт по той же схеме: теория, упражнения с ключами, словарь.","Один раз сверить на занятии ключи с пометкой «спорно»."]},
